spring.application.name=nousbooks

# Default to the dev profile when none is set explicitly.
# Override in production with SPRING_PROFILES_ACTIVE=prod
spring.profiles.default=dev

# Flyway owns the schema. Hibernate just validates that the
# entity classes match what Flyway built.
spring.jpa.hibernate.ddl-auto=validate

# SQL queries are surfaced via the org.hibernate.SQL logger (see logback-spring.xml),
# not via show-sql which prints to System.out and would duplicate every line.
# format_sql=false keeps each query on a single line to reduce console noise.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.flyway.enabled=true
# Cross-vendor migrations live under db/migration. Vendor-specific ones live
# under db/vendor/{vendor} (sibling path — sub-locations of db/migration are
# discarded by Flyway). {vendor} is replaced with the actual database name,
# so V10 (pgvector / hnsw) only runs on Postgres and is skipped on H2.
spring.flyway.locations=classpath:db/migration,classpath:db/vendor/{vendor}
# Allow applying migrations whose version is older than the highest applied
# one. Needed for vendor-specific migrations introduced after newer common
# ones (e.g. the H2 V10 added after V11 was already on disk).
spring.flyway.out-of-order=true

# Logging levels are configured per-profile in logback-spring.xml.
# Override at runtime with e.g. LOGGING_LEVEL_COM_MIGUELSALAMANCA_NOUSBOOKS=DEBUG.

# Directory used by the rolling file appender (prod profile).
# Override with LOG_DIR env var if you mount a different volume.
logging.file.path=${LOG_DIR:logs}

# JWT — la secret debe ser un string Base64 de al menos 256 bits (32 bytes).
# En producción, sobreescribir APP_JWT_SECRET con una variable de entorno.
app.jwt.secret=${APP_JWT_SECRET:bm91c2Jvb2tzLXN1cGVyLXNlY3JldC1rZXktZm9yLWRldmVsb3BtZW50LW9ubHkhISE=}
app.jwt.expiration-ms=86400000

# Google Books API key (optional in dev, required in prod to avoid quota limits)
# Set GOOGLE_BOOKS_API_KEY environment variable to use your own key
app.google-books.api-key=${GOOGLE_BOOKS_API_KEY:}

# Google OAuth client ID — used to verify ID tokens issued by Google Identity
# Services on the frontend. Get one at https://console.cloud.google.com/apis/credentials
# (Web application). Must match the NEXT_PUBLIC_GOOGLE_CLIENT_ID on the frontend.
app.google-oauth.client-id=${GOOGLE_OAUTH_CLIENT_ID:}

# CORS — comma-separated list of allowed origins.
# Override in production with FRONTEND_URL env var.
app.cors.allowed-origins=http://localhost:3000

# Gemini API — powers the semantic search over highlights.
# Get a free API key (no billing required) at https://aistudio.google.com/app/apikey
# When unset, highlights still save fine but semantic search returns empty.
app.gemini.api-key=${GEMINI_API_KEY:}
# How often the scheduled retry sweeps for highlights with a null embedding.
app.gemini.retry-delay-ms=300000
app.gemini.retry-initial-delay-ms=60000
